services:
  postgres:
    image: postgres:17
    container_name: taskapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp
      POSTGRES_DB: taskapp
    ports:
      - "5432:5432"
    volumes:
      - taskapp_pg:/var/lib/postgresql/data

volumes:
  taskapp_pg:
